<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>太虚 UI 设计图册</title><style>body{margin:0;background:#eee9dc;color:#303d37;font:15px/1.8 "Microsoft YaHei",sans-serif}main{max-width:1200px;margin:50px auto;padding:0 30px}h1,h2{font-family:KaiTi,SimSun,serif;font-weight:400;letter-spacing:4px}h1{font-size:38px}h2{margin:50px 0 10px}p{color:#747b6c;font-size:13px}a{color:#526f5c}img{width:100%;height:auto;display:block;border:1px solid #a19d8440;box-shadow:0 10px 25px #243b351a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}.grid figure{margin:0}figcaption{font-size:12px;margin:10px 0}nav{display:flex;gap:25px;margin:20px 0 40px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>太虚 · UI 重构图册</h1><p>三套视觉语言，同一套修行系统。概念图用于选风格，实际截图用于查看布局，交互原型用于体验动作。</p><nav><a href="index.html">打开可操作原型 →</a><a href="../../../../../docs/ai/archive/UI重制/README.md">设计与 Unity 接入说明</a></nav><h2>三套风格</h2><p>宣纸墨卷 ／ 黛青玉简 ／ 朱砂秘箓。图中自动生成的名字、数值和内容仅为美术占位。</p><a href="../../../Art/UI/Source/InkUI/Authoring/assets/three-directions.png"><img src="../../../Art/UI/Source/InkUI/Authoring/assets/three-directions.png" alt="三套修仙水墨 UI 风格对照"></a><h2>养成系统的统一设计</h2><p>背包、修炼、丹房与灵田；布局遵循现有机制，概念图中的细小文字以项目定义为准。</p><a href="../../../Art/UI/Source/InkUI/Authoring/assets/core-panels.png"><img src="../../../Art/UI/Source/InkUI/Authoring/assets/core-panels.png" alt="背包修炼炼丹灵田四界面美术模板"></a><h2>实际交互原型截图</h2><p>以下为本地浏览器实际渲染；素材是可编辑的 SVG 与 CSS，尚未替换 Unity 面板。</p><div class="grid"><figure><a href="../../../Art/UI/Source/InkUI/Authoring/assets/prototype-paper.png"><img src="../../../Art/UI/Source/InkUI/Authoring/assets/prototype-paper.png" alt="宣纸墨卷原型"></a><figcaption>01 宣纸墨卷 · 异形六槽</figcaption></figure><figure><a href="../../../Art/UI/Source/InkUI/Authoring/assets/prototype-jade.png"><img src="../../../Art/UI/Source/InkUI/Authoring/assets/prototype-jade.png" alt="黛青玉简原型"></a><figcaption>02 黛青玉简 · 同一功能系统</figcaption></figure><figure><a href="../../../Art/UI/Source/InkUI/Authoring/assets/prototype-seal.png"><img src="../../../Art/UI/Source/InkUI/Authoring/assets/prototype-seal.png" alt="朱砂秘箓原型"></a><figcaption>03 朱砂秘箓 · 玉符变为符纸</figcaption></figure><figure><a href="../../../Art/UI/Source/InkUI/Authoring/assets/prototype-inventory.png"><img src="../../../Art/UI/Source/InkUI/Authoring/assets/prototype-inventory.png" alt="背包原型"></a><figcaption>背包 · 网格、分类与固定详情</figcaption></figure><figure><a href="../../../Art/UI/Source/InkUI/Authoring/assets/prototype-cultivation.png"><img src="../../../Art/UI/Source/InkUI/Authoring/assets/prototype-cultivation.png" alt="修炼原型"></a><figcaption>修炼 · 功法、修为与次数</figcaption></figure><figure><a href="../../../Art/UI/Source/InkUI/Authoring/assets/prototype-alchemy.png"><img src="../../../Art/UI/Source/InkUI/Authoring/assets/prototype-alchemy.png" alt="丹房原型"></a><figcaption>丹房 · 配方、五格材料、成丹与消耗</figcaption></figure><figure><a href="../../../Art/UI/Source/InkUI/Authoring/assets/prototype-farm.png"><img src="../../../Art/UI/Source/InkUI/Authoring/assets/prototype-farm.png" alt="灵田原型"></a><figcaption>灵田 · 异形纸签、状态与摆放</figcaption></figure><figure><a href="../../../Art/UI/Source/InkUI/Authoring/assets/prototype-formation.png"><img src="../../../Art/UI/Source/InkUI/Authoring/assets/prototype-formation.png" alt="战阵原型"></a><figcaption>战阵 · 中心玩家、外围八格、五名上限</figcaption></figure></div><p style="margin:50px 0"><a href="index.html">进入原型：切换主题、拖拽神通、炼丹与查看灵田 →</a></p></main></body></html>
